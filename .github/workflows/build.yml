name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy compiles the app's Python with the same version it ships (3.10)
      - uses: actions/setup-python@v5
        id: py310
        with:
          python-version: "3.10"

      - name: Cache models and piano samples
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/models
            app/src/main/assets/www/samples
          key: assets-homr-0.7.0-salamander-v1

      - name: Fetch models and samples
        run: bash tools/fetch_assets.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.PR_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "PR_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No PR_KEYSTORE_B64 secret: signing with a throwaway debug key (updates will need a reinstall)"
          fi

      - name: Build release APKs
        env:
          PR_BUILD_PYTHON: ${{ steps.py310.outputs.python-path }}
          PR_VERSION_CODE: ${{ github.run_number }}
          PR_VERSION_NAME: 0.1.${{ github.run_number }}
          PR_KEYSTORE_PASSWORD: ${{ secrets.PR_KEYSTORE_PASSWORD }}
          PR_KEY_ALIAS: ${{ secrets.PR_KEY_ALIAS }}
          PR_KEY_PASSWORD: ${{ secrets.PR_KEY_PASSWORD }}
        run: |
          mkdir -p ci-logs
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee ci-logs/build.log

      - name: Publish build log
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/publish_logs.sh build ci-logs

      - name: Name the APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/phone/release/app-phone-release.apk "dist/PracticeRoom-0.1.${{ github.run_number }}-phone.apk"
          cp app/build/outputs/apk/emu/release/app-emu-release.apk "dist/PracticeRoom-0.1.${{ github.run_number }}-x86_64.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/*.apk
          retention-days: 30

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the test driver
        run: pip install playwright==1.56.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Scan a page on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash tools/emulator_selftest.sh dist/PracticeRoom-*-x86_64.apk selftest-output && bash tools/emulator_e2e.sh selftest-output

      - name: Publish self-test output
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/publish_logs.sh emulator selftest-output

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-output
          path: selftest-output

  release:
    needs: emulator-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Practice Room 0.1.${{ github.run_number }}
          body: |
            Install **PracticeRoom-0.1.${{ github.run_number }}-phone.apk** on your Android phone (Android 10 or newer).
            Passed the on-emulator scan self-test before publishing.
          files: dist/*-phone.apk
